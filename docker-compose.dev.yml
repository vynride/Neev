# Local stand-ins for Supabase Postgres and MongoDB Atlas. Dev only.
# Data is kept in memory and lost on restart; run `make seed` again afterwards.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mentor
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: mentor
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    tmpfs:
      - /data/db
