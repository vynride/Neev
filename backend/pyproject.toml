[project]
name = "mentor-backend"
version = "0.1.0"
description = "AI mentor backend for Barabari students"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "motor>=3.5",
    "openai>=1.50",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
